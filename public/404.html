<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Flore Beauty House</title>
    <script>
      // GitHub Pages SPA fix
      // Redirect ke index.html dengan query string yang berisi path asli
      var segmentCount = 1; // jumlah segmen path repo (1 = /flore-beauty-house)
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + segmentCount)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(segmentCount)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
